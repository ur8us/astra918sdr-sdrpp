name: Matching SDK module
on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: HTTPS ZIP with astra-sdk.json at its root and a matching built SDR++ SDK
        required: true
      os:
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        required: true
jobs:
  module:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libvolk2-dev libfftw3-dev libglfw3-dev
      - if: runner.os == 'macOS'
        run: brew install libusb pkg-config volk fftw glfw
      - name: Fetch matching SDK
        env:
          SDK_URL: ${{ inputs.sdk_url }}
        shell: python
        run: |
          import os, urllib.request, zipfile
          url = os.environ['SDK_URL']
          assert url.startswith('https://')
          urllib.request.urlretrieve(url, 'sdk.zip')
          with zipfile.ZipFile('sdk.zip') as archive:
              archive.extractall('sdk')
      - run: python scripts/build_sdk.py sdk
      - uses: actions/upload-artifact@v4
        with:
          name: astra918-source-${{ runner.os }}
          path: |
            build-sdk/astra918_source.so
            build-sdk/astra918_source.dylib
            build-sdk/Release/astra918_source.dll
