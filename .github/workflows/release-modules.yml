name: Build and publish SDR++ modules

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDRPP_COMMIT: 8c9f5ee8fe405775bfcd62c8c8f8c0fc928a64af

jobs:
  native:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            asset: linux-aarch64
          - runner: macos-15-intel
            platform: macos
            asset: macos-x86_64
          - runner: macos-15
            platform: macos
            asset: macos-arm64
          - runner: windows-2022
            platform: windows
            asset: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AlexandreRouma/SDRPlusPlus
          ref: 8c9f5ee8fe405775bfcd62c8c8f8c0fc928a64af
          path: sdrpp
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libusb-1.0-0-dev \
            libfftw3-dev libglfw3-dev libvolk-dev libzstd-dev librtaudio-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config libusb fftw glfw volk zstd rtaudio
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install fftw3:x64-windows glfw3:x64-windows zstd:x64-windows volk:x64-windows libusb:x64-windows
      - name: Configure matching SDR++ core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASTRA_CMAKE_GENERATOR: Visual Studio 17 2022
        run: python scripts/configure_upstream.py sdrpp "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DCMAKE_CXX_FLAGS=/I$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" "-DCMAKE_SHARED_LINKER_FLAGS=/LIBPATH:$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib" -DOPT_BUILD_RADIO=OFF -DOPT_BUILD_AUDIO_SINK=OFF
      - name: Configure matching SDR++ core
        if: runner.os != 'Windows'
        run: python3 scripts/configure_upstream.py sdrpp -DOPT_BUILD_RADIO=OFF -DOPT_BUILD_AUDIO_SINK=OFF
      - name: Build matching SDR++ core
        run: cmake --build sdrpp/build --target sdrpp_core --config Release --parallel 4
      - name: Configure and build Astra918 module
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build-module -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DASTRA918_BUILD_MODULE=ON -DSDRPP_SOURCE_DIR=sdrpp \
              -DSDRPP_CORE_LIBRARY=sdrpp/build/core/libsdrpp_core.dylib
            cmake --build build-module --config Release --parallel 4
            mkdir -p dist
            cp build-module/astra918_source.dylib "dist/astra918_source-$ASSET.dylib"
          else
            cmake -S . -B build-module -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DASTRA918_BUILD_MODULE=ON -DSDRPP_SOURCE_DIR=sdrpp \
              -DSDRPP_CORE_LIBRARY=sdrpp/build/core/libsdrpp_core.so
            cmake --build build-module --config Release --parallel 4
            mkdir -p dist
            cp build-module/astra918_source.so "dist/astra918_source-$ASSET.so"
          fi
          echo "$SDRPP_COMMIT" > dist/SDRPP_COMMIT.txt
        env:
          ASSET: ${{ matrix.asset }}
      - name: Configure and build Astra918 module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          cmake -S . -B build-module -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DASTRA918_BUILD_MODULE=ON -DSDRPP_SOURCE_DIR=sdrpp `
            -DSDRPP_CORE_LIBRARY=sdrpp/build/core/Release/sdrpp_core.lib `
            "-DSDRPP_SDK_INCLUDE_DIRS=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" `
            "-DSDRPP_SDK_LIBRARIES=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/volk.lib"
          cmake --build build-module --config Release --parallel 4
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-module/Release/astra918_source.dll "dist/astra918_source-$env:ASSET.dll"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/libusb-1.0.dll" dist/
          Set-Content -NoNewline dist/SDRPP_COMMIT.txt $env:SDRPP_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.asset }}
          path: dist/*

  riscv64:
    name: linux-riscv64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Build in RISC-V Ubuntu environment
        run: |
          docker run --rm --platform linux/riscv64 \
            -e SDRPP_COMMIT="$SDRPP_COMMIT" \
            -v "$GITHUB_WORKSPACE:/src" -w /src riscv64/ubuntu:24.04 bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build pkg-config g++ git python3 \
                libusb-1.0-0-dev libfftw3-dev libglfw3-dev libvolk-dev libzstd-dev
              git clone --recursive https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp
              git -C sdrpp checkout 8c9f5ee8fe405775bfcd62c8c8f8c0fc928a64af
              git -C sdrpp submodule update --init --recursive
              python3 scripts/configure_upstream.py sdrpp \
                -DOPT_BUILD_RADIO=OFF -DOPT_BUILD_AUDIO_SINK=OFF
              cmake -S . -B build-module -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DASTRA918_BUILD_MODULE=ON -DSDRPP_SOURCE_DIR=sdrpp
              cmake --build build-module --target astra918_source --parallel 4
              mkdir -p dist
              cp build-module/astra918_source.so dist/astra918_source-linux-riscv64.so
              echo "$SDRPP_COMMIT" > dist/SDRPP_COMMIT.txt
            '
      - uses: actions/upload-artifact@v4
        with:
          name: module-linux-riscv64
          path: dist/*

  release:
    name: Publish rolling release assets
    needs: [native, riscv64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare release metadata
        run: |
          cat > release-notes.md <<'EOF'
          Automatically built Astra918 SDR++ modules. These builds target the
          official SDR++ source commit `8c9f5ee8fe405775bfcd62c8c8f8c0fc928a64af`.
          SDR++ external modules use a C++ ABI; compatibility with builds made
          from other commits or toolchains is not guaranteed. Install steps and
          platform paths are in the repository README.
          EOF
          find dist -maxdepth 2 -type f -printf '%p\n'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Astra918 SDR++ modules (rolling)
          body_path: release-notes.md
          files: dist/**
          overwrite_files: true
          make_latest: true
